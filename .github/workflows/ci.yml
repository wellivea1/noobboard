name: CI

# Runs the same gates as scripts/check.ps1. If you change one, change the other:
# the script is what a contributor runs before pushing, this is what decides
# whether the push was right.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A second push to the same branch makes the first run's answer irrelevant.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: build, vet, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Single source of truth: the toolchain line in go.mod.
          go-version-file: go.mod
          cache: true

      - name: gofmt
        # .gitattributes pins the checkout to LF so this means the same thing
        # here as it does on a Windows workstation.
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files"
            echo "$unformatted"
            exit 1
          fi

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test
        # -race is the reason this job exists on Linux rather than only on the
        # Windows target: the server holds five mutexes over shared snapshot,
        # session and rate-limit state, and the race detector is the only thing
        # that checks them.
        run: go test -race -count=1 ./...

      - name: lint
        # Installed rather than pulled in as an action so CI runs the exact
        # binary scripts/check.ps1 runs locally. Pinned: a floating version
        # turns an upstream release into a surprise red build on an unrelated
        # pull request. Bump deliberately, and fix what the bump finds.
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          "$(go env GOPATH)/bin/golangci-lint" run ./...

  windows-build:
    name: windows build
    # NoobBoard ships as a Windows service. A Linux-only pipeline would not
    # notice a break in internal/service, which is entirely behind build tags.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        run: go build ./...
      - name: test
        run: go test -count=1 ./...

  conflict-markers:
    name: conflict markers
    # A merge that leaves markers in a Markdown file still compiles, and has
    # reached main here before.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: scan
        run: |
          if grep -rnE '^(<<<<<<< |>>>>>>> |=======$)' \
              --include='*.go' --include='*.js' --include='*.css' \
              --include='*.html' --include='*.md' --include='*.ps1' \
              cmd internal web docs scripts; then
            echo "::error::conflict markers found"
            exit 1
          fi
