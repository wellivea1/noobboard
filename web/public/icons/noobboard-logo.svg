<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1b201e" />
      <stop offset="100%" stop-color="#0e100f" />
    </radialGradient>
    
    <!-- Neon Teal -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4db6ac" />
      <stop offset="100%" stop-color="#00897b" />
    </linearGradient>
    
    <!-- Neon Violet -->
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="tealGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="violetGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  
  <!-- Outer Frame -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#232a27" stroke-width="2" />

  <!-- NAS Main Enclosure -->
  <rect x="88" y="118" width="336" height="286" rx="24" fill="#181c1a" stroke="#2a3330" stroke-width="5" />
  
  <!-- Outer Chassis Glow -->
  <rect x="84" y="114" width="344" height="294" rx="28" fill="none" stroke="url(#tealGrad)" stroke-width="2" opacity="0.35" filter="url(#tealGlow)" />

  <!-- Left Status Panel Separator -->
  <line x1="164" y1="118" x2="164" y2="404" stroke="#2a3330" stroke-width="3" />

  <!-- Left Panel: Controls & LEDs -->
  <g transform="translate(88, 118)">
    <!-- Power Button -->
    <circle cx="38" cy="46" r="12" fill="#121514" stroke="#2a3330" stroke-width="2" />
    <path d="M 38 40 L 38 46 M 33 43 A 6 6 0 1 0 43 43" fill="none" stroke="#4db6ac" stroke-width="2" stroke-linecap="round" filter="url(#tealGlow)" />
    
    <!-- Vertical Status LEDs -->
    <!-- Status LED -->
    <circle cx="38" cy="94" r="6" fill="#6bc7ba" filter="url(#tealGlow)" />

    <!-- LAN LED -->
    <circle cx="38" cy="138" r="6" fill="#6bc7ba" filter="url(#tealGlow)" />

    <!-- Disk Status LED (Degraded alert) -->
    <circle cx="38" cy="182" r="6" fill="#a78bfa" filter="url(#violetGlow)" />
  </g>

  <!-- Drive Bays Section (4 vertical hot-swap trays) -->
  
  <!-- Bay 1 (x=178) -->
  <g transform="translate(178, 138)">
    <rect width="50" height="246" rx="8" fill="#101311" stroke="#252b29" stroke-width="2" />
    <!-- Indicator LED -->
    <circle cx="25" cy="22" r="3.5" fill="#6bc7ba" filter="url(#tealGlow)" />
    <!-- Vent Holes/Grille Lines -->
    <line x1="15" y1="46" x2="35" y2="46" stroke="#1d2220" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="62" x2="35" y2="62" stroke="#1d2220" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="78" x2="35" y2="78" stroke="#1d2220" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="94" x2="35" y2="94" stroke="#1d2220" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="110" x2="35" y2="110" stroke="#1d2220" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="126" x2="35" y2="126" stroke="#1d2220" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="142" x2="35" y2="142" stroke="#1d2220" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="158" x2="35" y2="158" stroke="#1d2220" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="174" x2="35" y2="174" stroke="#1d2220" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="190" x2="35" y2="190" stroke="#1d2220" stroke-width="3" stroke-linecap="round" />
    <!-- Mechanical Eject Handle Latch -->
    <rect x="8" y="210" width="34" height="24" rx="4" fill="#1b201d" stroke="#2a332f" stroke-width="1.5" />
    <rect x="18" y="218" width="14" height="8" rx="1" fill="#0c0e0d" />
  </g>

  <!-- Bay 2 (x=236) -->
  <g transform="translate(236, 138)">
    <rect width="50" height="246" rx="8" fill="#101311" stroke="#252b29" stroke-width="2" />
    <circle cx="25" cy="22" r="3.5" fill="#6bc7ba" filter="url(#tealGlow)" />
    <line x1="15" y1="46" x2="35" y2="46" stroke="#1d2220" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="62" x2="35" y2="62" stroke="#1d2220" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="78" x2="35" y2="78" stroke="#1d2220" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="94" x2="35" y2="94" stroke="#1d2220" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="110" x2="35" y2="110" stroke="#1d2220" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="126" x2="35" y2="126" stroke="#1d2220" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="142" x2="35" y2="142" stroke="#1d2220" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="158" x2="35" y2="158" stroke="#1d2220" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="174" x2="35" y2="174" stroke="#1d2220" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="190" x2="35" y2="190" stroke="#1d2220" stroke-width="3" stroke-linecap="round" />
    <rect x="8" y="210" width="34" height="24" rx="4" fill="#1b201d" stroke="#2a332f" stroke-width="1.5" />
    <rect x="18" y="218" width="14" height="8" rx="1" fill="#0c0e0d" />
  </g>

  <!-- Bay 3 (x=294) - Shows degraded state alert (Purple) -->
  <g transform="translate(294, 138)">
    <rect width="50" height="246" rx="8" fill="#101311" stroke="#252b29" stroke-width="2" />
    <circle cx="25" cy="22" r="3.5" fill="#a78bfa" filter="url(#violetGlow)" />
    <line x1="15" y1="46" x2="35" y2="46" stroke="#1d2220" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="62" x2="35" y2="62" stroke="#1d2220" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="78" x2="35" y2="78" stroke="#1d2220" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="94" x2="35" y2="94" stroke="#1d2220" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="110" x2="35" y2="110" stroke="#1d2220" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="126" x2="35" y2="126" stroke="#1d2220" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="142" x2="35" y2="142" stroke="#1d2220" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="158" x2="35" y2="158" stroke="#1d2220" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="174" x2="35" y2="174" stroke="#1d2220" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="190" x2="35" y2="190" stroke="#1d2220" stroke-width="3" stroke-linecap="round" />
    <rect x="8" y="210" width="34" height="24" rx="4" fill="#1b201d" stroke="#2a332f" stroke-width="1.5" />
    <rect x="18" y="218" width="14" height="8" rx="1" fill="#0c0e0d" />
  </g>

  <!-- Bay 4 (x=352) -->
  <g transform="translate(352, 138)">
    <rect width="50" height="246" rx="8" fill="#101311" stroke="#252b29" stroke-width="2" />
    <circle cx="25" cy="22" r="3.5" fill="#6bc7ba" filter="url(#tealGlow)" />
    <line x1="15" y1="46" x2="35" y2="46" stroke="#1d2220" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="62" x2="35" y2="62" stroke="#1d2220" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="78" x2="35" y2="78" stroke="#1d2220" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="94" x2="35" y2="94" stroke="#1d2220" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="110" x2="35" y2="110" stroke="#1d2220" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="126" x2="35" y2="126" stroke="#1d2220" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="142" x2="35" y2="142" stroke="#1d2220" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="158" x2="35" y2="158" stroke="#1d2220" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="174" x2="35" y2="174" stroke="#1d2220" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="190" x2="35" y2="190" stroke="#1d2220" stroke-width="3" stroke-linecap="round" />
    <rect x="8" y="210" width="34" height="24" rx="4" fill="#1b201d" stroke="#2a332f" stroke-width="1.5" />
    <rect x="18" y="218" width="14" height="8" rx="1" fill="#0c0e0d" />
  </g>
</svg>
